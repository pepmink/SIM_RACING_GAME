<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wing Setup Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }
        h1 {
            color: #e10600;
            margin-top: 0;
        }
        h2 {
            color: #ff8700;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .team-card {
            background: #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid;
        }
        .setup-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        .wing-control {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
        }
        .wing-control label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #ff8700;
        }
        .wing-control input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #444;
            outline: none;
        }
        .wing-control input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e10600;
            cursor: pointer;
        }
        .value-display {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #e10600;
            margin: 10px 0;
        }
        .effects {
            margin-top: 15px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 5px;
        }
        .effect-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #333;
        }
        .effect-item:last-child {
            border-bottom: none;
        }
        .positive {
            color: #00ff00;
        }
        .negative {
            color: #ff4444;
        }
        .neutral {
            color: #888;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .stat-box {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .stat-change {
            font-size: 14px;
            margin-top: 5px;
        }
        button {
            background: #e10600;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 5px;
        }
        button:hover {
            background: #ff0700;
        }
        button.secondary {
            background: #444;
        }
        button.secondary:hover {
            background: #555;
        }
        .info-box {
            background: #1a3a5a;
            border-left: 4px solid #0066cc;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏎️ Wing Setup System - Monza Test</h1>
        <div class="info-box">
            <strong>Monza Track Profile:</strong> High speed circuit with long straights and few corners.
            <br><strong>Optimal Setup:</strong> Low downforce (15-35 front, 10-30 rear) for maximum speed.
        </div>
    </div>

    <div class="container">
        <h2>⚙️ Manual Setup Control</h2>
        <div class="setup-controls">
            <div class="wing-control">
                <label>Front Wing</label>
                <div class="value-display" id="frontWingValue">50</div>
                <input type="range" id="frontWing" min="0" max="100" value="50">
                <div class="effects" id="frontWingEffects"></div>
            </div>
            <div class="wing-control">
                <label>Rear Wing</label>
                <div class="value-display" id="rearWingValue">50</div>
                <input type="range" id="rearWing" min="0" max="100" value="50">
                <div class="effects" id="rearWingEffects"></div>
            </div>
        </div>
        <div style="text-align: center;">
            <button onclick="applySetupToAll()">Apply to All Teams</button>
            <button class="secondary" onclick="resetSetup()">Reset to Neutral (50/50)</button>
        </div>
    </div>

    <div class="container">
        <h2>🏁 Teams with Auto-Optimized Setup for Monza</h2>
        <button onclick="autoOptimizeAll()">🤖 Auto-Optimize All Teams</button>
        <div id="teamsContainer"></div>
    </div>

    <script type="module">
        import { DEFAULT_TEAMS_BY_CHAMP, DEFAULT_DRIVERS_BY_CHAMP } from './js/config/championships.js';
        import { 
            getFrontWingModifiers, 
            getRearWingModifiers,
            calculateOptimalSetupForMonza 
        } from './js/utils/wingSetup.js';

        // Global state
        window.teams = DEFAULT_TEAMS_BY_CHAMP.f1.map(t => ({...t}));
        window.drivers = DEFAULT_DRIVERS_BY_CHAMP.f1.map(d => ({...d}));

        // Update front wing display
        document.getElementById('frontWing').addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            document.getElementById('frontWingValue').textContent = value;
            
            const mods = getFrontWingModifiers(value);
            let html = '';
            
            if (value < 50) {
                html = `
                    <div class="effect-item">
                        <span>Overtaking:</span>
                        <span class="positive">+${mods.overtaking.toFixed(1)}</span>
                    </div>
                    <div class="effect-item">
                        <span>Defending:</span>
                        <span class="positive">+${mods.defending.toFixed(1)}</span>
                    </div>
                `;
            } else if (value > 50) {
                html = `
                    <div class="effect-item">
                        <span>Cornering:</span>
                        <span class="positive">+${mods.cornering.toFixed(1)}</span>
                    </div>
                    <div class="effect-item">
                        <span>Control:</span>
                        <span class="positive">+${mods.control.toFixed(1)}</span>
                    </div>
                `;
            } else {
                html = '<div class="effect-item"><span class="neutral">Neutral - No bonuses</span></div>';
            }
            
            document.getElementById('frontWingEffects').innerHTML = html;
        });

        // Update rear wing display
        document.getElementById('rearWing').addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            document.getElementById('rearWingValue').textContent = value;
            
            const mods = getRearWingModifiers(value);
            let html = '';
            
            if (value < 50) {
                html = `
                    <div class="effect-item">
                        <span>Braking:</span>
                        <span class="positive">+${mods.braking.toFixed(1)}</span>
                    </div>
                `;
            } else if (value > 50) {
                html = `
                    <div class="effect-item">
                        <span>Smooth:</span>
                        <span class="positive">+${mods.smooth.toFixed(1)}</span>
                    </div>
                `;
            } else {
                html = '<div class="effect-item"><span class="neutral">Neutral - No bonuses</span></div>';
            }
            
            document.getElementById('rearWingEffects').innerHTML = html;
        });

        // Apply setup to all teams
        window.applySetupToAll = function() {
            const frontWing = parseInt(document.getElementById('frontWing').value);
            const rearWing = parseInt(document.getElementById('rearWing').value);
            
            window.teams.forEach(team => {
                team.setup = { frontWing, rearWing };
            });
            
            renderTeams();
            alert(`Applied setup: Front Wing ${frontWing}, Rear Wing ${rearWing} to all teams!`);
        };

        // Reset setup
        window.resetSetup = function() {
            document.getElementById('frontWing').value = 50;
            document.getElementById('rearWing').value = 50;
            document.getElementById('frontWingValue').textContent = 50;
            document.getElementById('rearWingValue').textContent = 50;
            document.getElementById('frontWingEffects').innerHTML = '<div class="effect-item"><span class="neutral">Neutral - No bonuses</span></div>';
            document.getElementById('rearWingEffects').innerHTML = '<div class="effect-item"><span class="neutral">Neutral - No bonuses</span></div>';
        };

        // Auto-optimize all teams
        window.autoOptimizeAll = function() {
            window.teams.forEach(team => {
                const teamDrivers = window.drivers.filter(d => d.teamSeedId === team.seedId);
                const driver = teamDrivers[0]; // Use first driver
                
                if (driver) {
                    const optimal = calculateOptimalSetupForMonza(team, driver);
                    team.setup = {
                        frontWing: optimal.frontWing,
                        rearWing: optimal.rearWing
                    };
                    team.setupConfidence = optimal.confidence;
                }
            });
            
            renderTeams();
        };

        // Render teams
        function renderTeams() {
            const container = document.getElementById('teamsContainer');
            
            const html = window.teams.map(team => {
                const setup = team.setup || { frontWing: 50, rearWing: 50 };
                const frontMods = getFrontWingModifiers(setup.frontWing);
                const rearMods = getRearWingModifiers(setup.rearWing);
                const confidence = team.setupConfidence || 0;
                
                return `
                    <div class="team-card" style="border-left-color: ${team.color}">
                        <h3 style="color: ${team.color}; margin-top: 0;">${team.name}</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <strong>Car Stats:</strong>
                                <div class="stats-grid">
                                    <div class="stat-box">
                                        <div class="stat-label">Power Unit</div>
                                        <div class="stat-value">${team.carSetup.powerUnit}</div>
                                    </div>
                                    <div class="stat-box">
                                        <div class="stat-label">ERS Deploy</div>
                                        <div class="stat-value">${team.carSetup.ersDeploy}</div>
                                    </div>
                                    <div class="stat-box">
                                        <div class="stat-label">Downforce</div>
                                        <div class="stat-value">${team.carSetup.downforce}</div>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <strong>Wing Setup:</strong>
                                <div class="stats-grid">
                                    <div class="stat-box">
                                        <div class="stat-label">Front Wing</div>
                                        <div class="stat-value" style="color: ${setup.frontWing < 50 ? '#00ff00' : setup.frontWing > 50 ? '#ff8700' : '#888'}">${setup.frontWing}</div>
                                        <div class="stat-change">
                                            ${setup.frontWing < 50 ? `+${frontMods.overtaking.toFixed(1)} OVT` : setup.frontWing > 50 ? `+${frontMods.cornering.toFixed(1)} COR` : 'Neutral'}
                                        </div>
                                    </div>
                                    <div class="stat-box">
                                        <div class="stat-label">Rear Wing</div>
                                        <div class="stat-value" style="color: ${setup.rearWing < 50 ? '#00ff00' : setup.rearWing > 50 ? '#ff8700' : '#888'}">${setup.rearWing}</div>
                                        <div class="stat-change">
                                            ${setup.rearWing < 50 ? `+${rearMods.braking.toFixed(1)} BRK` : setup.rearWing > 50 ? `+${rearMods.smooth.toFixed(1)} SMO` : 'Neutral'}
                                        </div>
                                    </div>
                                    <div class="stat-box">
                                        <div class="stat-label">Confidence</div>
                                        <div class="stat-value" style="color: ${confidence > 85 ? '#00ff00' : confidence > 70 ? '#ff8700' : '#ff4444'}">${confidence}%</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = html;
        }

        // Initial render
        renderTeams();
        
        // Trigger initial display
        document.getElementById('frontWing').dispatchEvent(new Event('input'));
        document.getElementById('rearWing').dispatchEvent(new Event('input'));
    </script>
</body>
</html>
