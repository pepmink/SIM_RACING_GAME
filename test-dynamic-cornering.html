<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Cornering Speed Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
      color: #e0e0e0;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #e10600;
      margin-bottom: 10px;
      font-size: 2.5em;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 1.1em;
    }

    .test-section {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 25px;
      border: 1px solid #3a3a3a;
    }

    .test-section h2 {
      color: #4a9eff;
      margin-bottom: 15px;
      font-size: 1.5em;
      border-bottom: 2px solid #4a9eff;
      padding-bottom: 8px;
    }

    .test-section h3 {
      color: #ffa500;
      margin: 20px 0 10px 0;
      font-size: 1.2em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
      background: #1e1e1e;
      border-radius: 6px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #3a3a3a;
    }

    th {
      background: #333;
      color: #4a9eff;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85em;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background: #252525;
    }

    .positive {
      color: #4caf50;
      font-weight: 600;
    }

    .negative {
      color: #f44336;
      font-weight: 600;
    }

    .neutral {
      color: #888;
    }

    .stat-value {
      font-weight: 600;
      color: #ffa500;
    }

    .corner-name {
      font-weight: 600;
      color: #e0e0e0;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }

    .comparison-card {
      background: #1e1e1e;
      border-radius: 6px;
      padding: 20px;
      border: 2px solid #3a3a3a;
    }

    .comparison-card h4 {
      color: #4a9eff;
      margin-bottom: 15px;
      font-size: 1.1em;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-label {
      color: #888;
    }

    .summary-box {
      background: linear-gradient(135deg, #e10600 0%, #c10500 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
    }

    .summary-box h3 {
      color: white;
      margin-bottom: 10px;
    }

    .summary-box .big-number {
      font-size: 3em;
      font-weight: 700;
      margin: 10px 0;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85em;
      font-weight: 600;
      margin-left: 8px;
    }

    .badge-success {
      background: #4caf50;
      color: white;
    }

    .badge-warning {
      background: #ff9800;
      color: white;
    }

    .badge-info {
      background: #2196f3;
      color: white;
    }

    code {
      background: #1a1a1a;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      color: #4a9eff;
    }

    .status {
      text-align: center;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .status.success {
      background: #1b5e20;
      color: #4caf50;
      border: 2px solid #4caf50;
    }

    .status.error {
      background: #b71c1c;
      color: #f44336;
      border: 2px solid #f44336;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏎️ Dynamic Cornering Speed System Test</h1>
    <p class="subtitle">Validation & Performance Analysis</p>

    <div id="status" class="status"></div>
    <div id="results"></div>
  </div>

  <script type="module">
    import {
      calculateDynamicCornerSpeed,
      getAllCornerSpeeds,
      getCornerSpeedBreakdown,
      compareCornerSpeeds,
      BASE_CORNER_SPEEDS,
      TESTING
    } from './js/utils/dynamicCorneringSpeed.js';

    const resultsDiv = document.getElementById('results');
    const statusDiv = document.getElementById('status');

    try {
      // Test 1: Base Corner Speeds
      let html = `
        <div class="test-section">
          <h2>📊 Test 1: Base Corner Speeds (Reference)</h2>
          <p>These are the baseline speeds for an average car/driver (all stats = 85)</p>
          <table>
            <thead>
              <tr>
                <th>Corner</th>
                <th>Name</th>
                <th>Base Speed (km/h)</th>
                <th>Type</th>
              </tr>
            </thead>
            <tbody>
      `;

      const cornerNames = [
        'Turn 1: Prima Variante',
        'Turn 2: Seconda Variante',
        'Turn 3: Curva Grande Entry',
        'Turn 4: Lesmo 1',
        'Turn 5: Lesmo 2 Entry',
        'Turn 6: Lesmo 2 Apex',
        'Turn 7: Ascari Entry',
        'Turn 8: Ascari Exit',
        'Turn 9: Parabolica'
      ];

      BASE_CORNER_SPEEDS.forEach((speed, index) => {
        const type = speed < 100 ? '🐌 Slow' : speed < 200 ? '🏎️ Medium' : '🚀 Fast';
        html += `
          <tr>
            <td>${index + 1}</td>
            <td class="corner-name">${cornerNames[index]}</td>
            <td class="stat-value">${speed}</td>
            <td>${type}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      // Test 2: Mercedes vs Alpine Comparison
      const mercedesSetup = {
        carSetup: { downforce: 92, chassis: 90 },
        driverSkills: { cornering: 88, control: 86 },
        wingSetup: { frontWing: 80 }
      };

      const alpineSetup = {
        carSetup: { downforce: 78, chassis: 82 },
        driverSkills: { cornering: 78, control: 80 },
        wingSetup: { frontWing: 20 }
      };

      const comparison = compareCornerSpeeds(mercedesSetup, alpineSetup);

      html += `
        <div class="test-section">
          <h2>🏁 Test 2: Mercedes vs Alpine Comparison</h2>
          
          <div class="comparison-grid">
            <div class="comparison-card">
              <h4>🔴 Mercedes (Top Team)</h4>
              <div class="stat-row">
                <span class="stat-label">Downforce:</span>
                <span class="stat-value">92</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Chassis:</span>
                <span class="stat-value">90</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Cornering:</span>
                <span class="stat-value">88</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Control:</span>
                <span class="stat-value">86</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Front Wing:</span>
                <span class="stat-value">80 (High)</span>
              </div>
            </div>

            <div class="comparison-card">
              <h4>🔵 Alpine (Mid Team)</h4>
              <div class="stat-row">
                <span class="stat-label">Downforce:</span>
                <span class="stat-value">78</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Chassis:</span>
                <span class="stat-value">82</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Cornering:</span>
                <span class="stat-value">78</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Control:</span>
                <span class="stat-value">80</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Front Wing:</span>
                <span class="stat-value">20 (Low - Monza)</span>
              </div>
            </div>
          </div>

          <div class="summary-box">
            <h3>Total Advantage</h3>
            <div class="big-number">${comparison.totalAdvantage > 0 ? '+' : ''}${comparison.totalAdvantage} km/h</div>
            <p>Mercedes is ${Math.abs(comparison.totalAdvantage)} km/h faster across all 9 corners</p>
            <p>Average per corner: ${comparison.avgDifference > 0 ? '+' : ''}${comparison.avgDifference} km/h</p>
          </div>

          <table>
            <thead>
              <tr>
                <th>Corner</th>
                <th>Mercedes (km/h)</th>
                <th>Alpine (km/h)</th>
                <th>Difference</th>
                <th>% Faster</th>
              </tr>
            </thead>
            <tbody>
      `;

      comparison.differences.forEach((diff, index) => {
        const diffClass = diff.difference > 0 ? 'positive' : diff.difference < 0 ? 'negative' : 'neutral';
        html += `
          <tr>
            <td class="corner-name">${cornerNames[index]}</td>
            <td class="stat-value">${diff.speed1}</td>
            <td class="stat-value">${diff.speed2}</td>
            <td class="${diffClass}">${diff.difference > 0 ? '+' : ''}${diff.difference}</td>
            <td class="${diffClass}">${diff.percentDiff > 0 ? '+' : ''}${diff.percentDiff}%</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      // Test 3: Verstappen vs Stroll (Same Car)
      const verstappenSetup = {
        carSetup: { downforce: 95, chassis: 95 },
        driverSkills: { cornering: 95, control: 92 },
        wingSetup: { frontWing: 50 }
      };

      const strollSetup = {
        carSetup: { downforce: 95, chassis: 95 },
        driverSkills: { cornering: 75, control: 78 },
        wingSetup: { frontWing: 50 }
      };

      const driverComparison = compareCornerSpeeds(verstappenSetup, strollSetup);

      html += `
        <div class="test-section">
          <h2>👥 Test 3: Verstappen vs Stroll (Same Car - Red Bull)</h2>
          <p>Testing driver skill impact with identical car setup</p>

          <div class="summary-box">
            <h3>Driver Skill Advantage</h3>
            <div class="big-number">${driverComparison.totalAdvantage > 0 ? '+' : ''}${driverComparison.totalAdvantage} km/h</div>
            <p>Verstappen is ${Math.abs(driverComparison.totalAdvantage)} km/h faster with same car</p>
            <p>Average per corner: ${driverComparison.avgDifference > 0 ? '+' : ''}${driverComparison.avgDifference} km/h</p>
          </div>

          <table>
            <thead>
              <tr>
                <th>Corner</th>
                <th>Verstappen (km/h)</th>
                <th>Stroll (km/h)</th>
                <th>Difference</th>
              </tr>
            </thead>
            <tbody>
      `;

      driverComparison.differences.forEach((diff, index) => {
        const diffClass = diff.difference > 0 ? 'positive' : diff.difference < 0 ? 'negative' : 'neutral';
        html += `
          <tr>
            <td class="corner-name">${cornerNames[index]}</td>
            <td class="stat-value">${diff.speed1}</td>
            <td class="stat-value">${diff.speed2}</td>
            <td class="${diffClass}">${diff.difference > 0 ? '+' : ''}${diff.difference}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      // Test 4: Wing Setup Strategy
      const highWingSetup = {
        carSetup: { downforce: 85, chassis: 85 },
        driverSkills: { cornering: 85, control: 85 },
        wingSetup: { frontWing: 80 }
      };

      const lowWingSetup = {
        carSetup: { downforce: 85, chassis: 85 },
        driverSkills: { cornering: 85, control: 85 },
        wingSetup: { frontWing: 20 }
      };

      const wingComparison = compareCornerSpeeds(highWingSetup, lowWingSetup);

      html += `
        <div class="test-section">
          <h2>🔧 Test 4: Wing Setup Strategy (High vs Low)</h2>
          <p>Testing wing setup impact with identical car and driver</p>

          <div class="summary-box">
            <h3>Wing Setup Trade-off</h3>
            <div class="big-number">${wingComparison.totalAdvantage > 0 ? '+' : ''}${wingComparison.totalAdvantage} km/h</div>
            <p>High wing (80) is ${Math.abs(wingComparison.totalAdvantage)} km/h faster in corners</p>
            <p>But loses ~15 km/h on straights due to drag</p>
            <p><strong>Monza Optimal:</strong> Low wing (20) for 70% straight track</p>
          </div>

          <table>
            <thead>
              <tr>
                <th>Corner</th>
                <th>High Wing 80 (km/h)</th>
                <th>Low Wing 20 (km/h)</th>
                <th>Difference</th>
              </tr>
            </thead>
            <tbody>
      `;

      wingComparison.differences.forEach((diff, index) => {
        const diffClass = diff.difference > 0 ? 'positive' : diff.difference < 0 ? 'negative' : 'neutral';
        html += `
          <tr>
            <td class="corner-name">${cornerNames[index]}</td>
            <td class="stat-value">${diff.speed1}</td>
            <td class="stat-value">${diff.speed2}</td>
            <td class="${diffClass}">${diff.difference > 0 ? '+' : ''}${diff.difference}</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>
      `;

      // Test 5: Detailed Breakdown
      const breakdown = getCornerSpeedBreakdown(1, mercedesSetup.carSetup, mercedesSetup.driverSkills, mercedesSetup.wingSetup);

      html += `
        <div class="test-section">
          <h2>🔍 Test 5: Detailed Breakdown (Mercedes - Turn 2)</h2>
          <p>Analyzing each factor's contribution to corner speed</p>

          <table>
            <thead>
              <tr>
                <th>Factor</th>
                <th>Value</th>
                <th>Multiplier</th>
                <th>Impact (%)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>Base Speed</strong></td>
                <td class="stat-value">${breakdown.baseSpeed} km/h</td>
                <td>1.000</td>
                <td class="neutral">0.00%</td>
              </tr>
              <tr>
                <td>Downforce</td>
                <td class="stat-value">${breakdown.factors.downforce.value}</td>
                <td>${breakdown.factors.downforce.multiplier.toFixed(4)}</td>
                <td class="${breakdown.factors.downforce.impact > 0 ? 'positive' : 'negative'}">
                  ${breakdown.factors.downforce.impact > 0 ? '+' : ''}${breakdown.factors.downforce.impact.toFixed(2)}%
                </td>
              </tr>
              <tr>
                <td>Cornering Skill</td>
                <td class="stat-value">${breakdown.factors.cornering.value}</td>
                <td>${breakdown.factors.cornering.multiplier.toFixed(4)}</td>
                <td class="${breakdown.factors.cornering.impact > 0 ? 'positive' : 'negative'}">
                  ${breakdown.factors.cornering.impact > 0 ? '+' : ''}${breakdown.factors.cornering.impact.toFixed(2)}%
                </td>
              </tr>
              <tr>
                <td>Front Wing</td>
                <td class="stat-value">${breakdown.factors.frontWing.value}</td>
                <td>${breakdown.factors.frontWing.multiplier.toFixed(4)}</td>
                <td class="${breakdown.factors.frontWing.impact > 0 ? 'positive' : 'negative'}">
                  ${breakdown.factors.frontWing.impact > 0 ? '+' : ''}${breakdown.factors.frontWing.impact.toFixed(2)}%
                </td>
              </tr>
              <tr>
                <td>Control Skill</td>
                <td class="stat-value">${breakdown.factors.control.value}</td>
                <td>${breakdown.factors.control.multiplier.toFixed(4)}</td>
                <td class="${breakdown.factors.control.impact > 0 ? 'positive' : 'negative'}">
                  ${breakdown.factors.control.impact > 0 ? '+' : ''}${breakdown.factors.control.impact.toFixed(2)}%
                </td>
              </tr>
              <tr>
                <td>Chassis</td>
                <td class="stat-value">${breakdown.factors.chassis.value}</td>
                <td>${breakdown.factors.chassis.multiplier.toFixed(4)}</td>
                <td class="${breakdown.factors.chassis.impact > 0 ? 'positive' : 'negative'}">
                  ${breakdown.factors.chassis.impact > 0 ? '+' : ''}${breakdown.factors.chassis.impact.toFixed(2)}%
                </td>
              </tr>
              <tr style="background: #2a2a2a; font-weight: 600;">
                <td><strong>Final Speed</strong></td>
                <td class="stat-value">${breakdown.finalSpeed} km/h</td>
                <td>${breakdown.totalMultiplier.toFixed(4)}</td>
                <td class="${breakdown.speedDifference > 0 ? 'positive' : 'negative'}">
                  ${breakdown.speedDifference > 0 ? '+' : ''}${breakdown.speedDifference} km/h
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      `;

      resultsDiv.innerHTML = html;
      statusDiv.className = 'status success';
      statusDiv.innerHTML = '✅ All tests passed successfully! Dynamic Cornering Speed System is working correctly.';

    } catch (error) {
      console.error('Test failed:', error);
      statusDiv.className = 'status error';
      statusDiv.innerHTML = `❌ Test failed: ${error.message}`;
      resultsDiv.innerHTML = `
        <div class="test-section">
          <h2>Error Details</h2>
          <pre style="background: #1a1a1a; padding: 15px; border-radius: 6px; overflow-x: auto;">
${error.stack}
          </pre>
        </div>
      `;
    }
  </script>
</body>
</html>
